<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiva Event | Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="admin-login-page">
<div class="login-card">
  <div class="login-logo">S</div>
  <span class="login-kicker">SHIVA EVENT</span>
  <h1>Admin Login</h1>
  <p>Login to manage services, bookings and customer reviews.</p>
  <form id="adminLoginForm">
    <label>Username</label>
    <div class="login-input"><i class="fa-solid fa-user"></i><input id="adminUsername" type="text" autocomplete="username" required placeholder="Admin username"></div>
    <label>Password</label>
    <div class="login-input"><i class="fa-solid fa-lock"></i><input id="adminPassword" type="password" autocomplete="current-password" required placeholder="Admin password"></div>
    <button class="login-btn" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
    <div id="loginError" class="login-error"></div>
  </form>
  <a class="back-site" href="../index.html"><i class="fa-solid fa-arrow-left"></i> Back to Website</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
